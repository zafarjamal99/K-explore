name: K Explore Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify TypeScript Static Analysis
        run: npm run typecheck

      - name: Execute Vitest Test Suite
        run: npm run test

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high || echo "Audit completed with advisory warnings."

      - name: Build Production Assets
        run: npm run build

      - name: Verify Distribution Bundle
        run: |
          test -f dist/index.html || exit 1
          echo "Production build verified successfully."
